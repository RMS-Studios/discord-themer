[package]
name = "discord-themer"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "1.6", features = ["notification-all", "dialog-all", "fs-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
notify = "6.0"
url = "2.4"
hex = "0.4"
dirs = "5.0"
chrono = "0.4"
regex = "1.9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
